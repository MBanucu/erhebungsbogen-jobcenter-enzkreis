<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erhebungsbogen Jobcenter Enzkreis</title>
  <script src="./viewer/pdf.min.js"></script>
  <style>
    * { margin: 0; padding: 0; }
    body { 
      background: #525252;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      font-family: sans-serif;
    }
    .toolbar {
      background: #323232;
      width: 100%;
      max-width: 850px;
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      border-radius: 4px;
    }
    .toolbar button, .toolbar select {
      padding: 6px 12px;
      background: #474747;
      color: white;
      border: 1px solid #5a5a5a;
      border-radius: 3px;
      cursor: pointer;
    }
    .toolbar button:hover { background: #5a5a5a; }
    #viewer {
      background: #525252;
    }
    canvas {
      display: block;
      margin: 0 auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .page-info {
      color: #aaa;
      margin-left: auto;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button id="prev">◀</button>
    <select id="zoom">
      <option value="0.5">50%</option>
      <option value="0.75">75%</option>
      <option value="1" selected>100%</option>
      <option value="1.25">125%</option>
      <option value="1.5">150%</option>
      <option value="2">200%</option>
    </select>
    <button id="next">▶</button>
    <span class="page-info" id="page-info">1 / 1</span>
    <button id="download">Download</button>
  </div>
  <div id="viewer"></div>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = './viewer/pdf.worker.min.js';
    
    let pdfDoc = null;
    let pageNum = 1;
    let scale = 1;

    function renderPage(num) {
      pdfDoc.getPage(num).then(page => {
        const viewport = page.getViewport({ scale });
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;
        
        document.getElementById('viewer').innerHTML = '';
        document.getElementById('viewer').appendChild(canvas);
        
        page.render({ canvasContext: ctx, viewport });
        document.getElementById('page-info').textContent = `${num} / ${pdfDoc.numPages}`;
      });
    }

    document.getElementById('prev').addEventListener('click', () => {
      if (pageNum > 1) { pageNum--; renderPage(pageNum); }
    });

    document.getElementById('next').addEventListener('click', () => {
      if (pageNum < pdfDoc.numPages) { pageNum++; renderPage(pageNum); }
    });

    document.getElementById('zoom').addEventListener('change', (e) => {
      scale = parseFloat(e.target.value);
      renderPage(pageNum);
    });

    document.getElementById('download').addEventListener('click', () => {
      window.open('./main.pdf', '_blank');
    });

    pdfjsLib.getDocument('./main.pdf').promise.then(pdf => {
      pdfDoc = pdf;
      renderPage(1);
    });
  </script>
</body>
</html>
